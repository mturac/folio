name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # modernc.org/sqlite v1.57 needs Go 1.25+
          go-version: "1.25.0"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
