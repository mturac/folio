# Folio CI — Buildkite (same pattern as miraView).
# Pipeline upload: set the Buildkite pipeline steps to:
#   buildkite-agent pipeline upload .buildkite/pipeline.yml
#
# Setup: docs/buildkite.md

env:
  CI: "true"
  GOTOOLCHAIN: local

steps:
  - group: ":folio: Folio CI"
    key: folio-ci
    steps:
      - label: ":golang: test"
        key: test
        command: |
          set -euo pipefail
          go version
          go test ./...
        plugins:
          - docker#v5.13.0:
              image: "golang:1.25.0-bookworm"
              volumes:
                - "./:/workdir"
              workdir: /workdir
              propagate-environment: true
              environment:
                - "GOTOOLCHAIN=local"
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - label: ":golang: vet"
        key: vet
        command: |
          set -euo pipefail
          go vet ./...
        plugins:
          - docker#v5.13.0:
              image: "golang:1.25.0-bookworm"
              volumes:
                - "./:/workdir"
              workdir: /workdir
              propagate-environment: true
              environment:
                - "GOTOOLCHAIN=local"
        timeout_in_minutes: 10
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - label: ":hammer: build"
        key: build
        command: |
          set -euo pipefail
          go build -ldflags "-s -w -X main.version=ci" -o folio .
          ./folio version
        plugins:
          - docker#v5.13.0:
              image: "golang:1.25.0-bookworm"
              volumes:
                - "./:/workdir"
              workdir: /workdir
              propagate-environment: true
              environment:
                - "GOTOOLCHAIN=local"
        timeout_in_minutes: 10
        retry:
          automatic:
            - exit_status: -1
              limit: 2
