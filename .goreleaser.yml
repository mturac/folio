#!/bin/sh
# Goreleaser builds cross-platform folio binaries for GitHub Releases.
# Used from v0.5 onward; safe to run locally with: goreleaser release --snapshot --clean
version: 2
project_name: folio
before:
  hooks:
    - go test ./...
builds:
  - id: folio
    main: .
    binary: folio
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  draft: true
