# Goreleaser builds cross-platform folio binaries for GitHub Releases.
# Local snapshot: goreleaser release --snapshot --clean
version: 2
project_name: folio
builds:
  - id: folio
    main: .
    binary: folio
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  draft: false
  name_template: "folio {{.Tag}}"
  footer: |
    ## Install

    ```bash
    curl -fsSL https://raw.githubusercontent.com/mturac/folio/main/install.sh | bash
    ```

    Or grab the archive for your OS below, unpack, and put `folio` on your PATH.
